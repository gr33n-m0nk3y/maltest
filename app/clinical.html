<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical — Malta Foundation Training 1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav">
  <span class="brand">Malta F1 Prep</span>
  <a href="index.html">Learn</a>
  <a href="clinical.html" class="active">Clinical</a>
  <a href="self-test.html">Self-Test</a>
  <a href="situational.html">Situational</a>
  <a href="mock.html">Mock Exam</a>
  <a href="generate.html">Generate</a>
  <a href="settings.html">Settings</a>
</header>
<main>
  <h1>Clinical Knowledge</h1>
  <div class="sub">In-depth single-best-answer questions from the 39 exam topics. Starter set is AI-drafted and marked provisional — verify against your sources.</div>
  <div class="filters" id="filters">
    <button data-f="all" class="active">All topics</button>
    <button data-f="weak">🎯 Weak topics</button>
  </div>
  <button id="resetBtn" class="ghost" style="margin-bottom:18px">↺ Reset answered questions (this section)</button>
  <div id="container"></div>
</main>
<script src="js/engine.js"></script>
<script src="js/loader.js"></script>
<script src="js/practice.js"></script>
<script>
(async () => {
  const all = await Bank.load();
  const pool = all.filter((q) => q.source === "clinical" || (q.type === "sba" && q.source === "generated"));
  let current = pool;
  const container = document.getElementById("container");
  const filters = document.getElementById("filters");

  // build topic filter buttons
  const topics = await (await fetch("data/topics.json")).json();
  topics.forEach((t) => {
    const b = document.createElement("button");
    b.dataset.f = t.slug;
    b.textContent = t.name;
    filters.appendChild(b);
  });

  filters.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    document.querySelectorAll("#filters button").forEach((b) => b.classList.remove("active"));
    e.target.classList.add("active");
    const f = e.target.dataset.f;
    if (f === "all") current = pool;
    else if (f === "weak") {
      const weak = new Set(Progress.weakTopics(pool));
      current = pool.filter((q) => q.topic && weak.has(q.topic));
      if (!current.length) { container.innerHTML = '<div class="card"><p>No weak topics yet — attempt more questions and weak spots will appear here.</p></div>'; return; }
    } else current = pool.filter((q) => q.topic === f);
    Practice.run(container, current, { section: "clinical" });
  });
  // deep-link: ?topic=<slug> from the Learn tab
  const wanted = new URLSearchParams(location.search).get("topic");
  if (wanted) {
    const btn = [...filters.querySelectorAll("button")].find((b) => b.dataset.f === wanted);
    if (btn) { btn.click(); }
    else Practice.run(container, current, { section: "clinical" });
  } else {
    Practice.run(container, current, { section: "clinical" });
  }
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("Reset all answered questions in this section?")) {
      Practice.resetSection("clinical");
      location.reload();
    }
  };

})();
</script>
</body>
</html>
